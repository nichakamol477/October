<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Welcome October ♡</title>

<style>

/* =========================================================
   FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #F6C6C7;
    font-family: "Itim", sans-serif;
}


/* =========================================================
   ทุกหน้า
========================================================= */

.page {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100svh;

    overflow: hidden;

    background: #F6C6C7;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}


/* หน้าแรก */

#page1 {
    opacity: 1;
    visibility: visible;
}


/* หน้าที่ 2 ซ่อนไว้ก่อน */

#page2 {
    opacity: 0;
    visibility: hidden;

    pointer-events: none;
}


/* เมื่อเปลี่ยนหน้า */

body.next-page #page1 {
    opacity: 0;
    visibility: hidden;

    pointer-events: none;
}

body.next-page #page2 {
    opacity: 1;
    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   HEARTS
========================================================= */

.hearts {
    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;
}

.heart {
    position: absolute;

    color: rgba(255,255,255,0.75);

    font-family: Arial, sans-serif;

    opacity: 0;

    animation: floatHeart ease-in-out infinite;
}


/* ตำแหน่งหัวใจ */

.heart:nth-child(1) {
    left: 4%;
    top: 12%;
    font-size: 58px;
    animation-duration: 8s;
}

.heart:nth-child(2) {
    left: 16%;
    top: 68%;
    font-size: 42px;
    animation-duration: 10s;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 27%;
    top: 22%;
    font-size: 78px;
    animation-duration: 9s;
    animation-delay: 1s;
}

.heart:nth-child(4) {
    left: 42%;
    top: 76%;
    font-size: 45px;
    animation-duration: 11s;
    animation-delay: 3s;
}

.heart:nth-child(5) {
    left: 53%;
    top: 7%;
    font-size: 62px;
    animation-duration: 8s;
    animation-delay: 2s;
}

.heart:nth-child(6) {
    left: 65%;
    top: 57%;
    font-size: 44px;
    animation-duration: 10s;
    animation-delay: 4s;
}

.heart:nth-child(7) {
    left: 78%;
    top: 17%;
    font-size: 75px;
    animation-duration: 9s;
    animation-delay: 1s;
}

.heart:nth-child(8) {
    left: 91%;
    top: 70%;
    font-size: 48px;
    animation-duration: 11s;
    animation-delay: 3s;
}

.heart:nth-child(9) {
    left: 2%;
    top: 47%;
    font-size: 35px;
    animation-duration: 9s;
    animation-delay: 4s;
}

.heart:nth-child(10) {
    left: 86%;
    top: 43%;
    font-size: 65px;
    animation-duration: 8s;
    animation-delay: 2s;
}

.heart:nth-child(11) {
    left: 14%;
    top: 34%;
    font-size: 32px;
    animation-duration: 12s;
    animation-delay: 5s;
}

.heart:nth-child(12) {
    left: 60%;
    top: 34%;
    font-size: 40px;
    animation-duration: 10s;
    animation-delay: 1s;
}


@keyframes floatHeart {

    0% {
        opacity: 0.15;

        transform:
            translateY(20px)
            rotate(-8deg)
            scale(0.95);
    }

    50% {
        opacity: 0.75;

        transform:
            translateY(-25px)
            rotate(8deg)
            scale(1.06);
    }

    100% {
        opacity: 0.15;

        transform:
            translateY(20px)
            rotate(-8deg)
            scale(0.95);
    }
}


/* =========================================================
   WELCOME
========================================================= */

.welcome-text {

    position: absolute;

    z-index: 10;

    left: 50%;
    top: 17%;

    transform: translateX(-50%);

    width: 50%;

    text-align: center;

    color: #000;

    font-size:
        clamp(45px, 5vw, 78px);

    line-height: 1.25;
}

.welcome-text div {
    white-space: nowrap;
}


/* =========================================================
   POLAROID
========================================================= */

.polaroid {

    position: absolute;

    z-index: 12;

    width:
        clamp(
            210px,
            19vw,
            330px
        );

    /* อยู่ทางขวามากขึ้น */

    right:
        clamp(
            20px,
            3vw,
            60px
        );

    top:
        clamp(
            90px,
            17vh,
            180px
        );

    transform: rotate(10deg);
}

.polaroid img {

    display: block;

    width: 100%;
    height: auto;
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.music-player {

    position: absolute;

    z-index: 15;

    left:
        clamp(
            30px,
            4vw,
            70px
        );

    bottom:
        clamp(
            30px,
            7vh,
            80px
        );

    width:
        clamp(
            360px,
            34vw,
            520px
        );
}

.music-player img {

    display: block;

    width: 100%;
    height: auto;
}


/* =========================================================
   GIFT
========================================================= */

.gift-container {

    position: absolute;

    z-index: 30;

    left: 50%;
    top: 53%;

    transform:
        translate(-50%, -50%);

    width:
        clamp(
            210px,
            24vw,
            350px
        );

    cursor: pointer;

    text-align: center;
}


/* กล่องปิด */

.gift-box {

    display: block;

    width: 100%;
    height: auto;

    transition:
        transform 0.25s ease;
}


/* เอฟเฟกต์ตอนเอาเมาส์ไปวาง */

.gift-container:hover .gift-box {

    transform:
        scale(1.05)
        translateY(-5px);
}


/* ข้อความ */

.click-text {

    margin-top: 8px;

    font-size:
        clamp(
            22px,
            2.5vw,
            34px
        );

    color: #000;
}


/* =========================================================
   GIFT OPEN
========================================================= */

.gift-open {

    display: none;

    width: 100%;
    height: auto;
}


/* เมื่อเปิด */

.gift-container.open .gift-box {

    display: none;
}

.gift-container.open .click-text {

    display: none;
}

.gift-container.open .gift-open {

    display: block;

    animation:
        giftOpen
        0.8s
        ease-out
        forwards;
}


@keyframes giftOpen {

    0% {

        opacity: 0;

        transform:
            scale(0.5)
            translateY(30px)
            rotate(-5deg);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.08)
            translateY(-8px)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0)
            rotate(0);
    }
}


/* =========================================================
   PAGE 2
========================================================= */

.page2-content {

    position: relative;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;
}


/* กล่องเปิดตอนเปลี่ยนหน้า */

.open-gift-big {

    width:
        clamp(
            180px,
            25vw,
            320px
        );

    animation:
        giftOpenPage
        0.8s
        ease-out;
}


@keyframes giftOpenPage {

    0% {
        opacity: 0;

        transform:
            scale(0.5)
            translateY(30px);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.08)
            translateY(-5px);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


/* ข้อความหน้าที่ 2 */

.page2-title {

    margin-top: 20px;

    font-size:
        clamp(
            28px,
            4vw,
            50px
        );

    color: #000;
}


/* =========================================================
   MOBILE
========================================================= */

@media
(max-width: 767px)
and (orientation: portrait) {


    .welcome-text {

        top: 15%;

        width: 85%;

        font-size:
            clamp(
                38px,
                11vw,
                60px
            );
    }


    .polaroid {

        width:
            clamp(
                175px,
                42vw,
                250px
            );

        right: 1vw;

        top: 5vh;
    }


    .gift-container {

        width:
            clamp(
                190px,
                47vw,
                260px
            );

        top: 52%;
    }


    .music-player {

        width:
            clamp(
                290px,
                78vw,
                450px
            );

        left: 50%;

        bottom: 5vh;

        transform:
            translateX(-50%);
    }


    .music-player:hover {

        transform:
            translateX(-50%);
    }


    /* หัวใจมือถือ */

    .heart:nth-child(1) {
        font-size: 40px;
    }

    .heart:nth-child(2) {
        font-size: 30px;
    }

    .heart:nth-child(3) {
        font-size: 55px;
    }

    .heart:nth-child(4) {
        font-size: 35px;
    }

    .heart:nth-child(5) {
        font-size: 45px;
    }

    .heart:nth-child(6) {
        font-size: 30px;
    }

    .heart:nth-child(7) {
        font-size: 50px;
    }

    .heart:nth-child(8) {
        font-size: 35px;
    }

    .heart:nth-child(9) {
        font-size: 28px;
    }

    .heart:nth-child(10) {
        font-size: 45px;
    }

    .heart:nth-child(11) {
        font-size: 25px;
    }

    .heart:nth-child(12) {
        font-size: 30px;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media
(max-width: 420px)
and (orientation: portrait) {

    .welcome-text {

        top: 16%;

        font-size:
            clamp(
                35px,
                11vw,
                52px
            );
    }


    .polaroid {

        width: 40vw;

        right: 1vw;

        top: 5vh;
    }


    .gift-container {

        width: 48vw;

        top: 51%;
    }


    .music-player {

        width: 83vw;

        bottom: 5vh;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media
(max-width: 767px)
and (orientation: landscape) {

    .welcome-text {

        display: none;
    }


    .polaroid {

        width: 23vw;

        right: 5vw;

        top: 7vh;
    }


    .gift-container {

        width: 25vw;

        top: 48%;
    }


    .music-player {

        width: 40vw;

        left: 4vw;

        bottom: 5vh;

        transform: none;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     PAGE 1
======================================================== -->

<section
    class="page"
    id="page1"
>


    <!-- หัวใจ -->

    <div class="hearts">

        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>

    </div>


    <!-- Welcome -->

    <div class="welcome-text">

        <div>Welcome</div>

        <div>october</div>

    </div>


    <!-- Polaroid -->

    <div class="polaroid">

        <img
            src="For you2.png"
            alt="Polaroid"
        >

    </div>


    <!-- Music -->

    <div class="music-player">

        <img
            src="For you.png"
            alt="Music player"
        >

    </div>


    <!-- Gift -->

    <div
        class="gift-container"
        id="giftContainer"
    >

        <img
            class="gift-box"
            src="gift.png"
            alt="Gift box"
        >


        <img
            class="gift-open"
            src="gift-open.png"
            alt="Open gift"
        >


        <div class="click-text">
            Click me ♡
        </div>

    </div>

</section>



<!-- =======================================================
     PAGE 2
======================================================== -->

<section
    class="page"
    id="page2"
>

    <div class="page2-content">


        <!-- กล่องเปิด -->

        <img
            class="open-gift-big"
            src="gift-open.png"
            alt="Open gift"
        >


        <div class="page2-title">

            ♡ Something for you ♡

        </div>

    </div>

</section>



<script>

/* =========================================================
   GIFT CLICK
========================================================= */

const gift =
    document.getElementById("giftContainer");


gift.addEventListener(
    "click",
    function() {


        /* ป้องกันกดซ้ำ */

        if (
            gift.classList.contains("open")
        ) {
            return;
        }


        /* เปลี่ยนจากกล่องปิด
           เป็นกล่องเปิด */

        gift.classList.add("open");


        /*
           รอให้เห็น animation
           กล่องเปิดก่อน
        */

        setTimeout(
            function() {

                /*
                   เปลี่ยนไปหน้าที่ 2
                */

                document.body.classList.add(
                    "next-page"
                );

            },
            1000
        );

    }
);


/* =========================================================
   ป้องกันลากรูป
========================================================= */

document
.querySelectorAll("img")
.forEach(function(img) {

    img.addEventListener(
        "dragstart",
        function(event) {

            event.preventDefault();

        }
    );

});

</script>


</body>

</html>
