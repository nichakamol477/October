<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Welcome October ♡</title>

<style>

/* =========================================================
   FONT
========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');


/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;
    font-family: "Itim", sans-serif;
    background: #FADCDC;
}


/* =========================================================
   MAIN PAGE
========================================================= */
.page {
    position: relative;

    width: 100%;
    min-height: 100svh;

    overflow: hidden;

    background-color: #FADCDC;
}

.content {
    position: relative;

    width: 100%;
    min-height: 100svh;
}


/* =========================================================
   FLOATING HEARTS
========================================================= */
.hearts {
    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    overflow: hidden;
}

.heart {
    position: absolute;

    color: rgba(255, 255, 255, 0.9);

    font-size: clamp(10px, 1.2vw, 18px);

    opacity: 0;

    animation: floatHeart linear infinite;
}


/* ---------------------------------------------------------
   HEART POSITIONS
--------------------------------------------------------- */

.heart:nth-child(1) {
    left: 7%;
    top: 15%;
    font-size: 13px;
    animation-duration: 7s;
    animation-delay: 0s;
}

.heart:nth-child(2) {
    left: 17%;
    top: 65%;
    font-size: 10px;
    animation-duration: 9s;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 29%;
    top: 25%;
    font-size: 16px;
    animation-duration: 8s;
    animation-delay: 1s;
}

.heart:nth-child(4) {
    left: 41%;
    top: 78%;
    font-size: 11px;
    animation-duration: 10s;
    animation-delay: 3s;
}

.heart:nth-child(5) {
    left: 52%;
    top: 12%;
    font-size: 14px;
    animation-duration: 8s;
    animation-delay: 2s;
}

.heart:nth-child(6) {
    left: 63%;
    top: 58%;
    font-size: 10px;
    animation-duration: 9s;
    animation-delay: 4s;
}

.heart:nth-child(7) {
    left: 73%;
    top: 30%;
    font-size: 17px;
    animation-duration: 7s;
    animation-delay: 1s;
}

.heart:nth-child(8) {
    left: 83%;
    top: 70%;
    font-size: 12px;
    animation-duration: 10s;
    animation-delay: 3s;
}

.heart:nth-child(9) {
    left: 93%;
    top: 18%;
    font-size: 9px;
    animation-duration: 8s;
    animation-delay: 5s;
}

.heart:nth-child(10) {
    left: 11%;
    top: 88%;
    font-size: 15px;
    animation-duration: 9s;
    animation-delay: 4s;
}

.heart:nth-child(11) {
    left: 37%;
    top: 48%;
    font-size: 9px;
    animation-duration: 11s;
    animation-delay: 1s;
}

.heart:nth-child(12) {
    left: 88%;
    top: 48%;
    font-size: 15px;
    animation-duration: 8s;
    animation-delay: 2s;
}


/* ---------------------------------------------------------
   HEART ANIMATION
--------------------------------------------------------- */

@keyframes floatHeart {

    0% {
        opacity: 0;
        transform: translateY(25px) rotate(-10deg);
    }

    20% {
        opacity: 0.8;
    }

    50% {
        opacity: 1;
        transform: translateY(-15px) rotate(8deg);
    }

    80% {
        opacity: 0.7;
    }

    100% {
        opacity: 0;
        transform: translateY(-45px) rotate(-8deg);
    }
}


/* =========================================================
   WELCOME OCTOBER
========================================================= */
.welcome-text {
    position: absolute;

    z-index: 20;

    left: 50%;
    top: 18%;

    transform: translateX(-50%);

    width: 55%;

    text-align: center;

    color: #000;

    font-family: "Itim", sans-serif;

    font-size: clamp(40px, 5vw, 78px);

    line-height: 1.25;

    pointer-events: none;
}

.welcome-text div {
    white-space: nowrap;
}


/* =========================================================
   MUSIC PLAYER
   For you.png
========================================================= */
.music-player {
    position: absolute;

    z-index: 18;

    left: clamp(25px, 3.1vw, 55px);

    bottom: clamp(25px, 5.5vh, 65px);

    width: clamp(360px, 35vw, 500px);

    transition:
        transform .3s ease,
        filter .3s ease;
}

.music-player img {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;
}

.music-player:hover {
    transform: translateY(-5px);
    filter: brightness(1.04);
}


/* =========================================================
   POLAROID
   For you2.png
========================================================= */
.polaroid {
    position: absolute;

    z-index: 15;

    right: 7%;
    top: 20%;

    width: clamp(190px, 18vw, 280px);

    transform: rotate(10deg) scale(1.35);

    transform-origin: center center;

    transition: transform .35s ease;
}

.polaroid img {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;
}

.polaroid:hover {
    transform: rotate(7deg) scale(1.4);
}


/* =========================================================
   DOG
   For you3.png
========================================================= */
.dog {
    position: absolute;

    z-index: 25;
}

.dog img {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;
}


/* ---------------------------------------------------------
   DOG BOTTOM RIGHT
--------------------------------------------------------- */

.dog-bottom {
    width: clamp(160px, 18vw, 270px);

    right: -2%;
    bottom: -2%;

    transform: scale(1.35);

    transform-origin: bottom right;
}


/* ---------------------------------------------------------
   DOG TOP LEFT
--------------------------------------------------------- */

.dog-top {
    display: none;
}


/* =========================================================
   TABLET / IPAD
========================================================= */
@media (min-width: 768px) and (max-width: 1199px) {

    .welcome-text {
        display: none;
    }

    .music-player {
        width: clamp(300px, 38vw, 440px);

        left: 4vw;
        bottom: 6vh;
    }

    .polaroid {
        width: clamp(180px, 22vw, 270px);

        right: 7vw;
        top: 19vh;

        transform: rotate(10deg) scale(1.35);
    }

    .dog-bottom {
        width: clamp(160px, 22vw, 275px);

        right: -2vw;
        bottom: -5px;

        transform: scale(1.35);

        transform-origin: bottom right;
    }

    .dog-top {
        display: none;
    }
}


/* =========================================================
   IPAD PORTRAIT
========================================================= */
@media (min-width: 768px)
       and (max-width: 1199px)
       and (orientation: portrait) {

    .music-player {
        width: 48vw;

        left: 4vw;
        bottom: 7vh;
    }

    .polaroid {
        width: 24vw;

        right: 6vw;
        top: 20vh;

        transform: rotate(10deg) scale(1.35);
    }

    .dog-bottom {
        width: 23vw;

        right: -1vw;
        bottom: 0;

        transform: scale(1.35);
    }
}


/* =========================================================
   MOBILE PORTRAIT
   ใช้พื้นหลัง #FADCDC
========================================================= */
@media (max-width: 767px) {

    .welcome-text {
        display: block;

        left: 50%;
        top: 12%;

        width: 62%;

        font-size: clamp(38px, 11vw, 75px);

        line-height: 1.25;
    }


    /* POLAROID */
    .polaroid {
        width: clamp(155px, 40vw, 240px);

        right: 3%;
        top: 4%;

        transform: rotate(10deg) scale(1.35);

        transform-origin: center center;
    }


    /* MUSIC PLAYER */
    .music-player {
        width: clamp(300px, 76vw, 500px);

        left: 50%;
        bottom: 8%;

        transform: translateX(-50%);
    }

    .music-player:hover {
        transform: translateX(-50%);
    }


    /* DOG BOTTOM */
    .dog-bottom {
        width: clamp(150px, 37vw, 230px);

        right: -4%;
        bottom: -2%;

        transform: scale(1.4);

        transform-origin: bottom right;
    }


    /* DOG TOP */
    .dog-top {
        display: block;

        width: clamp(125px, 33vw, 205px);

        left: -7%;
        top: -2%;

        transform: rotate(180deg) scale(1.25);

        transform-origin: center center;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */
@media (max-width: 420px) {

    .welcome-text {
        top: 12%;

        width: 66%;

        font-size: clamp(35px, 11vw, 55px);
    }

    .polaroid {
        width: 39vw;

        right: 3vw;
        top: 3%;

        transform: rotate(10deg) scale(1.35);
    }

    .music-player {
        width: 82vw;

        bottom: 7%;
    }

    .dog-bottom {
        width: 36vw;

        right: -4vw;
        bottom: 0;

        transform: scale(1.4);
    }

    .dog-top {
        width: 33vw;

        left: -8vw;
        top: -1%;

        transform: rotate(180deg) scale(1.25);
    }
}


/* =========================================================
   VERY SMALL PHONE
========================================================= */
@media (max-width: 360px) {

    .welcome-text {
        top: 11%;

        width: 70%;

        font-size: 35px;
    }

    .polaroid {
        width: 40vw;

        right: 2vw;
        top: 3%;

        transform: rotate(10deg) scale(1.35);
    }

    .music-player {
        width: 86vw;

        bottom: 6%;
    }

    .dog-bottom {
        width: 38vw;

        right: -4vw;
        bottom: 0;

        transform: scale(1.4);
    }

    .dog-top {
        width: 35vw;

        left: -8vw;
        top: -1%;

        transform: rotate(180deg) scale(1.25);
    }
}


/* =========================================================
   PHONE LANDSCAPE
========================================================= */
@media (max-width: 767px) and (orientation: landscape) {

    .welcome-text {
        display: none;
    }

    .dog-top {
        display: none;
    }

    .music-player {
        width: 40vw;

        left: 4vw;
        bottom: 5vh;

        transform: none;
    }

    .music-player:hover {
        transform: translateY(-5px);
    }

    .polaroid {
        width: 23vw;
        max-width: 260px;

        right: 10vw;
        top: 9vh;

        transform: rotate(10deg) scale(1.35);
    }

    .dog-bottom {
        width: 21vw;
        max-width: 240px;

        right: -1vw;
        bottom: -2px;

        transform: scale(1.35);

        transform-origin: bottom right;
    }
}


/* =========================================================
   REDUCE MOTION
========================================================= */
@media (prefers-reduced-motion: reduce) {

    * {
        transition: none !important;
        animation: none !important;
    }
}

</style>
</head>


<body>

<div class="page">

    <div class="content">


        <!-- =================================================
             หัวใจลอย
        ================================================== -->

        <div class="hearts">

            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>

        </div>


        <!-- =================================================
             WELCOME
        ================================================== -->

        <div class="welcome-text">

            <div>Welcome</div>

            <div>october</div>

        </div>


        <!-- =================================================
             DOG TOP LEFT
        ================================================== -->

        <div class="dog dog-top">

            <img
                src="For you3.png"
                alt="Dog"
            >

        </div>


        <!-- =================================================
             MUSIC PLAYER
        ================================================== -->

        <div class="music-player">

            <img
                src="For you.png"
                alt="Music player"
            >

        </div>


        <!-- =================================================
             POLAROID
        ================================================== -->

        <div class="polaroid">

            <img
                src="For you2.png"
                alt="Polaroid photos"
            >

        </div>


        <!-- =================================================
             DOG BOTTOM RIGHT
        ================================================== -->

        <div class="dog dog-bottom">

            <img
                src="For you3.png"
                alt="Dog"
            >

        </div>


    </div>

</div>


<script>

/* =========================================================
   ป้องกันรูปถูกลาก
========================================================= */

document.querySelectorAll("img").forEach(function(img) {

    img.addEventListener("dragstart", function(event) {

        event.preventDefault();

    });

});


/* =========================================================
   เมื่อหมุนหน้าจอ
========================================================= */

window.addEventListener("orientationchange", function() {

    setTimeout(function() {

        window.scrollTo(0, 0);

    }, 100);

});

</script>

</body>
</html>
