<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Welcome October ♡</title>


<style>

/* =========================================================
   FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {

    overflow: hidden;

    font-family: "Itim", sans-serif;

    background: #F6C6C7;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100svh;

    overflow: hidden;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}


/* =========================================================
   PAGE 1
========================================================= */

#page1 {

    background: #F6C6C7;

    opacity: 1;

    visibility: visible;

    z-index: 1;
}


/* =========================================================
   PAGE 2
========================================================= */

#page2 {

    background: #D0F4DE;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    z-index: 5;
}


/* เปลี่ยนหน้า */

body.show-video #page1 {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


body.show-video #page2 {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.hearts {

    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;
}


.heart {

    position: absolute;

    color: rgba(255,255,255,0.75);

    font-family: Arial, sans-serif;

    opacity: 0;

    animation:
        floatHeart
        ease-in-out
        infinite;
}


/* ตำแหน่งหัวใจ */

.heart:nth-child(1) {
    left: 4%;
    top: 12%;
    font-size: 58px;
    animation-duration: 8s;
}


.heart:nth-child(2) {
    left: 16%;
    top: 68%;
    font-size: 42px;
    animation-duration: 10s;
    animation-delay: 2s;
}


.heart:nth-child(3) {
    left: 27%;
    top: 22%;
    font-size: 78px;
    animation-duration: 9s;
    animation-delay: 1s;
}


.heart:nth-child(4) {
    left: 42%;
    top: 76%;
    font-size: 45px;
    animation-duration: 11s;
    animation-delay: 3s;
}


.heart:nth-child(5) {
    left: 53%;
    top: 7%;
    font-size: 62px;
    animation-duration: 8s;
    animation-delay: 2s;
}


.heart:nth-child(6) {
    left: 65%;
    top: 57%;
    font-size: 44px;
    animation-duration: 10s;
    animation-delay: 4s;
}


.heart:nth-child(7) {
    left: 78%;
    top: 17%;
    font-size: 75px;
    animation-duration: 9s;
    animation-delay: 1s;
}


.heart:nth-child(8) {
    left: 91%;
    top: 70%;
    font-size: 48px;
    animation-duration: 11s;
    animation-delay: 3s;
}


.heart:nth-child(9) {
    left: 2%;
    top: 47%;
    font-size: 35px;
    animation-duration: 9s;
    animation-delay: 4s;
}


.heart:nth-child(10) {
    left: 86%;
    top: 43%;
    font-size: 65px;
    animation-duration: 8s;
    animation-delay: 2s;
}


.heart:nth-child(11) {
    left: 14%;
    top: 34%;
    font-size: 32px;
    animation-duration: 12s;
    animation-delay: 5s;
}


.heart:nth-child(12) {
    left: 60%;
    top: 34%;
    font-size: 40px;
    animation-duration: 10s;
    animation-delay: 1s;
}


/* =========================================================
   HEART ANIMATION
========================================================= */

@keyframes floatHeart {

    0% {

        opacity: 0.15;

        transform:
            translateY(20px)
            rotate(-8deg)
            scale(0.95);
    }


    50% {

        opacity: 0.75;

        transform:
            translateY(-25px)
            rotate(8deg)
            scale(1.06);
    }


    100% {

        opacity: 0.15;

        transform:
            translateY(20px)
            rotate(-8deg)
            scale(0.95);
    }
}


/* =========================================================
   WELCOME
   ขยับขึ้นด้านบน
========================================================= */

.welcome-text {

    position: absolute;

    z-index: 10;

    left: 50%;

    top: 8%;

    transform: translateX(-50%);

    width: 55%;

    text-align: center;

    color: #000;

    font-size:
        clamp(
            45px,
            5vw,
            78px
        );

    line-height: 1.2;
}


.welcome-text div {

    white-space: nowrap;
}


/* =========================================================
   POLAROID
========================================================= */

.polaroid {

    position: absolute;

    z-index: 12;

    width:
        clamp(
            210px,
            19vw,
            330px
        );

    right:
        clamp(
            20px,
            3vw,
            60px
        );

    top:
        clamp(
            90px,
            15vh,
            170px
        );

    transform: rotate(10deg);
}


.polaroid img {

    display: block;

    width: 100%;

    height: auto;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.music-player {

    position: absolute;

    z-index: 15;

    left:
        clamp(
            30px,
            4vw,
            70px
        );

    bottom:
        clamp(
            30px,
            7vh,
            80px
        );

    width:
        clamp(
            360px,
            34vw,
            520px
        );
}


.music-player img {

    display: block;

    width: 100%;

    height: auto;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   GIFT
========================================================= */

.gift-container {

    position: absolute;

    z-index: 30;

    left: 50%;

    top: 52%;

    transform:
        translate(-50%, -50%);

    width:
        clamp(
            210px,
            24vw,
            350px
        );

    text-align: center;
}


/* =========================================================
   GIFT IMAGE
========================================================= */

.gift-box {

    display: block;

    width: 100%;

    height: auto;

    transition:
        transform 0.25s ease;
}


/* เมื่อเอาเมาส์ชี้ */

.gift-container:hover .gift-box {

    transform:
        scale(1.04)
        translateY(-5px);
}


/* =========================================================
   GIFT OPEN
========================================================= */

.gift-open {

    display: none;

    width: 100%;

    height: auto;
}


/* =========================================================
   CLICK BUTTON
========================================================= */

.click-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    margin-top: 18px;

    padding:
        8px 25px 10px;

    min-width: 150px;

    border: none;

    border-radius: 999px;

    background: #ffffff;

    color: #000000;

    font-family: "Itim", sans-serif;

    font-size:
        clamp(
            23px,
            2.5vw,
            34px
        );

    line-height: 1;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.10);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.click-button:hover {

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 8px 18px
        rgba(0,0,0,0.15);
}


.click-button:active {

    transform:
        scale(0.96);
}


/* =========================================================
   ตอนเปิดกล่อง
========================================================= */

.gift-container.open .gift-box {

    display: none;
}


.gift-container.open .gift-open {

    display: block;

    animation:
        giftOpenAnimation
        0.8s
        ease-out
        forwards;
}


.gift-container.open .click-button {

    display: none;
}


/* =========================================================
   GIFT OPEN ANIMATION
========================================================= */

@keyframes giftOpenAnimation {

    0% {

        opacity: 0;

        transform:
            scale(0.55)
            translateY(30px)
            rotate(-5deg);
    }


    60% {

        opacity: 1;

        transform:
            scale(1.08)
            translateY(-8px)
            rotate(2deg);
    }


    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0)
            rotate(0);
    }
}


/* =========================================================
   VIDEO PAGE
========================================================= */

.video-page-content {

    position: relative;

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 2vh 2vw;
}


/* =========================================================
   VIDEO
========================================================= */

#myVideo {

    display: block;

    width: 100%;

    height: 100%;

    max-width: 100%;

    max-height: 100%;

    object-fit: contain;

    border-radius: 12px;

    background: #D0F4DE;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.12);
}


/* =========================================================
   MOBILE
========================================================= */

@media
(max-width: 767px)
and (orientation: portrait) {


    .welcome-text {

        top: 7%;

        width: 90%;

        font-size:
            clamp(
                38px,
                11vw,
                60px
            );
    }


    .polaroid {

        width:
            clamp(
                175px,
                42vw,
                250px
            );

        right: 1vw;

        top: 5vh;
    }


    .gift-container {

        width:
            clamp(
                190px,
                47vw,
                260px
            );

        top: 52%;
    }


    .click-button {

        margin-top: 12px;

        min-width: 135px;

        padding:
            8px 20px 10px;

        font-size: 25px;
    }


    .music-player {

        width:
            clamp(
                290px,
                78vw,
                450px
            );

        left: 50%;

        bottom: 5vh;

        transform:
            translateX(-50%);
    }


    /* หัวใจมือถือ */

    .heart:nth-child(1) {
        font-size: 40px;
    }

    .heart:nth-child(2) {
        font-size: 30px;
    }

    .heart:nth-child(3) {
        font-size: 55px;
    }

    .heart:nth-child(4) {
        font-size: 35px;
    }

    .heart:nth-child(5) {
        font-size: 45px;
    }

    .heart:nth-child(6) {
        font-size: 30px;
    }

    .heart:nth-child(7) {
        font-size: 50px;
    }

    .heart:nth-child(8) {
        font-size: 35px;
    }

    .heart:nth-child(9) {
        font-size: 28px;
    }

    .heart:nth-child(10) {
        font-size: 45px;
    }

    .heart:nth-child(11) {
        font-size: 25px;
    }

    .heart:nth-child(12) {
        font-size: 30px;
    }


    /* วิดีโอบนมือถือ */

    .video-page-content {

        padding: 0;
    }


    #myVideo {

        width: 100%;

        height: 100%;

        border-radius: 0;

        box-shadow: none;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media
(max-width: 420px)
and (orientation: portrait) {


    .welcome-text {

        top: 7%;

        font-size:
            clamp(
                35px,
                11vw,
                52px
            );
    }


    .polaroid {

        width: 40vw;

        right: 1vw;

        top: 5vh;
    }


    .gift-container {

        width: 48vw;

        top: 51%;
    }


    .music-player {

        width: 83vw;

        bottom: 5vh;
    }
}


/* =========================================================
   PHONE LANDSCAPE
========================================================= */

@media
(max-width: 767px)
and (orientation: landscape) {


    .welcome-text {

        top: 5%;

        font-size: 38px;
    }


    .polaroid {

        width: 23vw;

        right: 5vw;

        top: 7vh;
    }


    .gift-container {

        width: 25vw;

        top: 48%;
    }


    .music-player {

        width: 40vw;

        left: 4vw;

        bottom: 5vh;

        transform: none;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     PAGE 1
======================================================== -->

<section
    class="page"
    id="page1"
>


    <!-- หัวใจลอย -->

    <div class="hearts">

        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>

    </div>


    <!-- Welcome -->

    <div class="welcome-text">

        <div>Welcome</div>

        <div>october</div>

    </div>


    <!-- Polaroid -->

    <div class="polaroid">

        <img
            src="For you2.png"
            alt="Polaroid"
        >

    </div>


    <!-- Music Player -->

    <div class="music-player">

        <img
            src="For you.png"
            alt="Music player"
        >

    </div>


    <!-- Gift -->

    <div
        class="gift-container"
        id="giftContainer"
    >

        <!-- กล่องปิด -->

        <img
            class="gift-box"
            src="gift.png"
            alt="Gift box"
        >


        <!-- กล่องเปิด -->

        <img
            class="gift-open"
            src="gift-open.png"
            alt="Open gift"
        >


        <!-- ปุ่ม -->

        <button
            class="click-button"
            id="clickButton"
        >
            Click me ♡
        </button>

    </div>

</section>



<!-- =======================================================
     PAGE 2 : VIDEO
======================================================== -->

<section
    class="page"
    id="page2"
>

    <div class="video-page-content">

        <video
            id="myVideo"
            controls
            playsinline
            preload="auto"
        >

            <source
                src="PLENG.mp4"
                type="video/mp4"
            >

            เบราว์เซอร์ของคุณไม่รองรับวิดีโอ

        </video>

    </div>

</section>



<script>

/* =========================================================
   GIFT
========================================================= */

const giftContainer =
    document.getElementById("giftContainer");

const clickButton =
    document.getElementById("clickButton");

const video =
    document.getElementById("myVideo");


let isOpening = false;


/* =========================================================
   CLICK GIFT
========================================================= */

clickButton.addEventListener(
    "click",
    function(event) {

        /* ป้องกัน event อื่น */

        event.stopPropagation();


        /* ป้องกันกดซ้ำ */

        if (isOpening) {
            return;
        }


        isOpening = true;


        /*
           เปลี่ยนกล่องจาก
           gift.png
           เป็น
           gift-open.png
        */

        giftContainer.classList.add("open");


        /*
           รอ 5 วินาที
           แล้วเปลี่ยนไปหน้าวิดีโอ
        */

        setTimeout(
            function() {

                document.body.classList.add(
                    "show-video"
                );


                /*
                   กลับไปเริ่มวิดีโอ
                */

                video.currentTime = 0;


                /*
                   พยายามเล่นวิดีโอ

                   บางเบราว์เซอร์อาจไม่อนุญาต
                   autoplay จึงมี controls ให้กดเล่น
                */

                video.play().catch(
                    function() {

                        console.log(
                            "ต้องกด Play เพื่อเล่นวิดีโอ"
                        );

                    }
                );

            },
            5000
        );

    }
);


/* =========================================================
   ป้องกันลากรูป
========================================================= */

document
.querySelectorAll("img")
.forEach(function(img) {

    img.addEventListener(
        "dragstart",
        function(event) {

            event.preventDefault();

        }
    );

});

</script>


</body>

</html>
