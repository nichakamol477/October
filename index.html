<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffd8ee">

<title>Welcome October ♡</title>

<style>

/* =========================================================
   FONT : ITIM
========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');


/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;
    font-family: "Itim", sans-serif;
    background: #fbdcf0;
}


/* =========================================================
   MAIN PAGE
   คอม + iPad = c.png
   มือถือแนวตั้ง = f.png
========================================================= */
.page {
    position: relative;

    width: 100%;
    min-height: 100svh;

    overflow: hidden;

    background-image: url("c.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

.content {
    position: relative;

    width: 100%;
    min-height: 100svh;
}


/* =========================================================
   WELCOME OCTOBER
========================================================= */
.welcome-text {
    position: absolute;

    z-index: 20;

    left: 50%;
    top: 18%;

    transform: translateX(-50%);

    width: 55%;

    text-align: center;

    color: #000;

    font-family: "Itim", sans-serif;
    font-weight: normal;

    font-size: clamp(40px, 5vw, 78px);

    line-height: 1.25;

    pointer-events: none;
}

.welcome-text div {
    white-space: nowrap;
}


/* =========================================================
   MUSIC PLAYER
   For you.png
========================================================= */
.music-player {
    position: absolute;

    z-index: 18;

    left: clamp(25px, 3.1vw, 55px);

    bottom: clamp(25px, 5.5vh, 65px);

    width: clamp(360px, 35vw, 500px);

    transition:
        transform .3s ease,
        filter .3s ease;
}

.music-player img {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;

    -webkit-user-drag: none;
}

.music-player:hover {
    transform: translateY(-5px);

    filter: brightness(1.04);
}


/* =========================================================
   POLAROID
   For you2.png
========================================================= */
.polaroid {
    position: absolute;

    z-index: 15;

    right: clamp(30px, 5vw, 100px);

    top: clamp(90px, 18vh, 190px);

    /* ใหญ่ขึ้น */
    width: clamp(230px, 23vw, 350px);

    transform: rotate(10deg);

    transition:
        transform .35s ease,
        filter .3s ease;
}

.polaroid img {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;

    -webkit-user-drag: none;
}

.polaroid:hover {
    transform: rotate(7deg) scale(1.03);
}


/* =========================================================
   DOG
   For you3.png
========================================================= */
.dog {
    position: absolute;

    z-index: 25;
}

.dog img {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;

    -webkit-user-drag: none;
}


/* หมาใหญ่ขวาล่าง */
.dog-bottom {
    width: clamp(200px, 21vw, 320px);

    right: clamp(-25px, -1vw, 0px);

    bottom: clamp(-25px, -1vh, 0px);
}


/* หัวหมาซ้ายบน
   ปกติซ่อนบนคอม/iPad */
.dog-top {
    display: none;
}


/* =========================================================
   TABLET / iPAD
========================================================= */
@media (min-width: 768px) and (max-width: 1199px) {

    .page {
        background-image: url("c.png");

        background-size: cover;

        background-position: center center;
    }

    .welcome-text {
        display: none;
    }

    /* เพลง */
    .music-player {
        width: clamp(300px, 38vw, 440px);

        left: 4vw;

        bottom: 6vh;
    }

    /* โพลารอยด์ */
    .polaroid {
        width: clamp(220px, 27vw, 340px);

        right: 5vw;

        top: 19vh;
    }

    /* หมา */
    .dog-bottom {
        width: clamp(190px, 25vw, 315px);

        right: -1vw;

        bottom: -5px;
    }

    .dog-top {
        display: none;
    }
}


/* =========================================================
   iPAD แนวตั้ง
========================================================= */
@media (min-width: 768px)
       and (max-width: 1199px)
       and (orientation: portrait) {

    /* เพลง */
    .music-player {
        width: 48vw;

        left: 4vw;

        bottom: 7vh;
    }

    /* โพลารอยด์ */
    .polaroid {
        width: clamp(240px, 32vw, 360px);

        right: 5vw;

        top: 20vh;
    }

    /* หมา */
    .dog-bottom {
        width: clamp(210px, 29vw, 330px);

        right: -1vw;

        bottom: 0;
    }
}


/* =========================================================
   MOBILE
   ใช้ f.png
========================================================= */
@media (max-width: 767px) {

    .page {
        background-image: url("f.png");

        background-size: cover;

        background-position: center top;

        background-repeat: no-repeat;

        min-height: 100svh;
    }

    .content {
        min-height: 100svh;
    }


    /* -------------------------
       Welcome
    ------------------------- */

    .welcome-text {

        display: block;

        left: 50%;

        top: 12%;

        width: 62%;

        font-size: clamp(38px, 11vw, 75px);

        line-height: 1.25;
    }


    /* -------------------------
       Polaroid
    ------------------------- */

    .polaroid {

        width: clamp(200px, 48vw, 290px);

        right: 1%;

        top: 4%;

        transform: rotate(10deg);
    }


    /* -------------------------
       Music
    ------------------------- */

    .music-player {

        width: clamp(300px, 76vw, 500px);

        left: 50%;

        bottom: 8%;

        transform: translateX(-50%);
    }

    .music-player:hover {
        transform: translateX(-50%);
    }


    /* -------------------------
       หมาใหญ่ขวาล่าง
    ------------------------- */

    .dog-bottom {

        width: clamp(180px, 43vw, 260px);

        right: -5%;

        bottom: -1%;
    }


    /* -------------------------
       หัวหมาซ้ายบน
    ------------------------- */

    .dog-top {

        display: block;

        width: clamp(145px, 38vw, 225px);

        left: -8%;

        top: -2%;

        transform: rotate(180deg);
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */
@media (max-width: 420px) {

    .welcome-text {

        top: 12%;

        width: 66%;

        font-size: clamp(35px, 11vw, 55px);
    }


    .polaroid {

        width: clamp(195px, 49vw, 255px);

        right: 3vw;

        top: 3%;
    }


    .music-player {

        width: 82vw;

        bottom: 7%;
    }


    .dog-bottom {

        width: clamp(170px, 43vw, 225px);

        right: -4vw;

        bottom: 0;
    }


    .dog-top {

        width: clamp(135px, 37vw, 200px);

        left: -9vw;

        top: -1%;
    }
}


/* =========================================================
   VERY SMALL PHONE
========================================================= */
@media (max-width: 360px) {

    .welcome-text {

        top: 11%;

        width: 70%;

        font-size: 35px;
    }


    .polaroid {

        width: 49vw;

        right: 2vw;

        top: 3%;
    }


    .music-player {

        width: 86vw;

        bottom: 6%;
    }


    .dog-bottom {

        width: 43vw;

        right: -4vw;
    }


    .dog-top {

        width: 39vw;

        left: -9vw;
    }
}


/* =========================================================
   PHONE LANDSCAPE
   ใช้ c.png
========================================================= */
@media (max-width: 767px) and (orientation: landscape) {

    .page {

        background-image: url("c.png");

        background-position: center center;
    }


    .welcome-text {
        display: none;
    }


    .dog-top {
        display: none;
    }


    .music-player {

        width: 40vw;

        left: 4vw;

        bottom: 5vh;

        transform: none;
    }

    .music-player:hover {
        transform: translateY(-5px);
    }


    .polaroid {

        width: 27vw;

        max-width: 280px;

        right: 10vw;

        top: 9vh;
    }


    .dog-bottom {

        width: 24vw;

        max-width: 250px;

        right: 0;

        bottom: -2px;
    }
}


/* =========================================================
   REDUCE MOTION
========================================================= */
@media (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior: auto !important;

        transition: none !important;
    }
}

</style>
</head>


<body>

<div class="page">

    <div class="content">

        <!-- Welcome October -->
        <div class="welcome-text">
            <div>Welcome</div>
            <div>october</div>
        </div>


        <!-- หัวหมาซ้ายบนมือถือ -->
        <div class="dog dog-top">
            <img
                src="For you3.png"
                alt="Dog"
            >
        </div>


        <!-- เครื่องเล่นเพลง -->
        <div class="music-player">
            <img
                src="For you.png"
                alt="Music player"
            >
        </div>


        <!-- โพลารอยด์ -->
        <div class="polaroid">
            <img
                src="For you2.png"
                alt="Polaroid photos"
            >
        </div>


        <!-- หมาใหญ่ขวาล่าง -->
        <div class="dog dog-bottom">
            <img
                src="For you3.png"
                alt="Dog"
            >
        </div>

    </div>

</div>


<script>

/* =========================================================
   ป้องกันรูปถูกลาก
========================================================= */

document.querySelectorAll("img").forEach(function (img) {

    img.addEventListener("dragstart", function (event) {

        event.preventDefault();

    });

});


/* =========================================================
   เมื่อหมุนหน้าจอ
========================================================= */

window.addEventListener("orientationchange", function () {

    setTimeout(function () {

        window.scrollTo(0, 0);

    }, 100);

});

</script>

</body>
</html>
