<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffd8ee">

<title>Welcome October ♡</title>

<style>

/* =========================================================
   FONT : ITIM
========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');


/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;
    font-family: "Itim", sans-serif;
    background: #fbdcf0;
}


/* =========================================================
   MAIN
   คอม + iPad = c.png
   มือถือแนวตั้ง = f.png
========================================================= */
.page {
    position: relative;
    width: 100%;
    min-height: 100svh;
    overflow: hidden;

    background-image: url("c.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

.content {
    position: relative;
    width: 100%;
    min-height: 100svh;
}


/* =========================================================
   WELCOME OCTOBER
========================================================= */
.welcome-text {
    position: absolute;
    z-index: 20;

    left: 50%;
    top: 18%;

    transform: translateX(-50%);

    width: 55%;

    text-align: center;

    color: #000;

    font-family: "Itim", sans-serif;
    font-weight: normal;

    font-size: clamp(40px, 5vw, 78px);
    line-height: 1.25;

    pointer-events: none;
}

.welcome-text div {
    white-space: nowrap;
}


/* =========================================================
   MUSIC PLAYER
   For you.png
========================================================= */
.music-player {
    position: absolute;
    z-index: 18;

    left: clamp(25px, 3.1vw, 55px);
    bottom: clamp(25px, 5.5vh, 65px);

    width: clamp(360px, 35vw, 500px);

    transition:
        transform .3s ease,
        filter .3s ease;
}

.music-player img {
    display: block;
    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;
}

.music-player:hover {
    transform: translateY(-5px);
    filter: brightness(1.04);
}


/* =========================================================
   POLAROID
   For you2.png
========================================================= */
.polaroid {
    position: absolute;
    z-index: 15;

    right: 7%;
    top: 20%;

    width: clamp(190px, 18vw, 280px);

    transform: rotate(10deg) scale(1.35);
    transform-origin: center center;

    transition: transform .35s ease;
}

.polaroid img {
    display: block;
    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;
}

.polaroid:hover {
    transform: rotate(7deg) scale(1.4);
}


/* =========================================================
   DOG
   For you3.png
========================================================= */
.dog {
    position: absolute;
    z-index: 25;
}

.dog img {
    display: block;
    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;
}


/* หมาใหญ่ขวาล่าง */
.dog-bottom {
    width: clamp(160px, 18vw, 270px);

    right: -2%;
    bottom: -2%;

    transform: scale(1.35);
    transform-origin: bottom right;
}


/* หัวหมาซ้ายบน */
.dog-top {
    display: none;
}


/* =========================================================
   TABLET / iPAD
========================================================= */
@media (min-width: 768px) and (max-width: 1199px) {

    .page {
        background-image: url("c.png");
        background-size: cover;
        background-position: center center;
    }

    .welcome-text {
        display: none;
    }

    .music-player {
        width: clamp(300px, 38vw, 440px);
        left: 4vw;
        bottom: 6vh;
    }

    .polaroid {
        width: clamp(180px, 22vw, 270px);

        right: 7vw;
        top: 19vh;

        transform: rotate(10deg) scale(1.35);
        transform-origin: center center;
    }

    .dog-bottom {
        width: clamp(160px, 22vw, 275px);

        right: -2vw;
        bottom: -5px;

        transform: scale(1.35);
        transform-origin: bottom right;
    }

    .dog-top {
        display: none;
    }
}


/* =========================================================
   iPAD แนวตั้ง
========================================================= */
@media (min-width: 768px)
       and (max-width: 1199px)
       and (orientation: portrait) {

    .music-player {
        width: 48vw;
        left: 4vw;
        bottom: 7vh;
    }

    .polaroid {
        width: 24vw;

        right: 6vw;
        top: 20vh;

        transform: rotate(10deg) scale(1.35);
    }

    .dog-bottom {
        width: 23vw;

        right: -1vw;
        bottom: 0;

        transform: scale(1.35);
        transform-origin: bottom right;
    }
}


/* =========================================================
   MOBILE
   ใช้ f.png
========================================================= */
@media (max-width: 767px) {

    .page {
        background-image: url("f.png");
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
    }

    .welcome-text {
        display: block;

        left: 50%;
        top: 12%;

        width: 62%;

        font-size: clamp(38px, 11vw, 75px);
        line-height: 1.25;
    }


    /* POLAROID */
    .polaroid {
        width: clamp(155px, 40vw, 240px);

        right: 3%;
        top: 4%;

        transform: rotate(10deg) scale(1.35);
        transform-origin: center center;
    }


    /* MUSIC */
    .music-player {
        width: clamp(300px, 76vw, 500px);

        left: 50%;
        bottom: 8%;

        transform: translateX(-50%);
    }

    .music-player:hover {
        transform: translateX(-50%);
    }


    /* หมาใหญ่ขวาล่าง */
    .dog-bottom {
        width: clamp(150px, 37vw, 230px);

        right: -4%;
        bottom: -2%;

        transform: scale(1.4);
        transform-origin: bottom right;
    }


    /* หัวหมาซ้ายบน */
    .dog-top {
        display: block;

        width: clamp(125px, 33vw, 205px);

        left: -7%;
        top: -2%;

        transform: rotate(180deg) scale(1.25);
        transform-origin: center center;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */
@media (max-width: 420px) {

    .welcome-text {
        top: 12%;
        width: 66%;
        font-size: clamp(35px, 11vw, 55px);
    }

    .polaroid {
        width: 39vw;

        right: 3vw;
        top: 3%;

        transform: rotate(10deg) scale(1.35);
    }

    .music-player {
        width: 82vw;
        bottom: 7%;
    }

    .dog-bottom {
        width: 36vw;

        right: -4vw;
        bottom: 0;

        transform: scale(1.4);
        transform-origin: bottom right;
    }

    .dog-top {
        width: 33vw;

        left: -8vw;
        top: -1%;

        transform: rotate(180deg) scale(1.25);
    }
}


/* =========================================================
   VERY SMALL PHONE
========================================================= */
@media (max-width: 360px) {

    .welcome-text {
        top: 11%;
        width: 70%;
        font-size: 35px;
    }

    .polaroid {
        width: 40vw;

        right: 2vw;
        top: 3%;

        transform: rotate(10deg) scale(1.35);
    }

    .music-player {
        width: 86vw;
        bottom: 6%;
    }

    .dog-bottom {
        width: 38vw;

        right: -4vw;
        bottom: 0;

        transform: scale(1.4);
    }

    .dog-top {
        width: 35vw;

        left: -8vw;
        top: -1%;

        transform: rotate(180deg) scale(1.25);
    }
}


/* =========================================================
   PHONE LANDSCAPE
   ใช้ c.png
========================================================= */
@media (max-width: 767px) and (orientation: landscape) {

    .page {
        background-image: url("c.png");
        background-position: center center;
    }

    .welcome-text {
        display: none;
    }

    .dog-top {
        display: none;
    }

    .music-player {
        width: 40vw;
        left: 4vw;
        bottom: 5vh;
        transform: none;
    }

    .music-player:hover {
        transform: translateY(-5px);
    }

    .polaroid {
        width: 23vw;
        max-width: 260px;

        right: 10vw;
        top: 9vh;

        transform: rotate(10deg) scale(1.35);
    }

    .dog-bottom {
        width: 21vw;
        max-width: 240px;

        right: -1vw;
        bottom: -2px;

        transform: scale(1.35);
        transform-origin: bottom right;
    }
}


/* =========================================================
   REDUCE MOTION
========================================================= */
@media (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior: auto !important;
        transition: none !important;
    }
}

</style>
</head>


<body>

<div class="page">

    <div class="content">

        <!-- Welcome October -->
        <div class="welcome-text">
            <div>Welcome</div>
            <div>october</div>
        </div>


        <!-- หัวหมาซ้ายบนมือถือ -->
        <div class="dog dog-top">
            <img src="For you3.png" alt="Dog">
        </div>


        <!-- เครื่องเล่นเพลง -->
        <div class="music-player">
            <img src="For you.png" alt="Music player">
        </div>


        <!-- โพลารอยด์ -->
        <div class="polaroid">
            <img src="For you2.png" alt="Polaroid photos">
        </div>


        <!-- หมาใหญ่ขวาล่าง -->
        <div class="dog dog-bottom">
            <img src="For you3.png" alt="Dog">
        </div>

    </div>

</div>


<script>

/* ป้องกันรูปถูกลาก */
document.querySelectorAll("img").forEach(function (img) {

    img.addEventListener("dragstart", function (event) {
        event.preventDefault();
    });

});


/* เมื่อหมุนหน้าจอ */
window.addEventListener("orientationchange", function () {

    setTimeout(function () {
        window.scrollTo(0, 0);
    }, 100);

});

</script>

</body>
</html>
