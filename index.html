<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Welcome October ♡</title>


<style>

/* =========================================================
   FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    min-height: 100%;
}


body {

    overflow: hidden;

    background: #F6C6C7;

    font-family: "Itim", sans-serif;
}


/* =========================================================
   MAIN PAGE
========================================================= */

.page {

    position: relative;

    width: 100%;
    height: 100svh;

    overflow: hidden;

    background: #F6C6C7;
}


.content {

    position: relative;

    width: 100%;
    height: 100%;
}


/* =========================================================
   FLOATING HEARTS
   หัวใจสีขาวใหญ่ด้านหลัง
========================================================= */

.hearts {

    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    overflow: hidden;
}


.heart {

    position: absolute;

    color: rgba(255, 255, 255, 0.72);

    font-family: Arial, sans-serif;

    font-weight: normal;

    opacity: 0;

    animation:
        floatHeart
        ease-in-out
        infinite;
}


/* =========================================================
   HEART POSITIONS
========================================================= */

.heart:nth-child(1) {

    left: 5%;
    top: 13%;

    font-size: 55px;

    animation-duration: 8s;
    animation-delay: 0s;
}


.heart:nth-child(2) {

    left: 17%;
    top: 70%;

    font-size: 38px;

    animation-duration: 10s;
    animation-delay: 2s;
}


.heart:nth-child(3) {

    left: 29%;
    top: 22%;

    font-size: 75px;

    animation-duration: 9s;
    animation-delay: 1s;
}


.heart:nth-child(4) {

    left: 42%;
    top: 76%;

    font-size: 48px;

    animation-duration: 11s;
    animation-delay: 3s;
}


.heart:nth-child(5) {

    left: 53%;
    top: 9%;

    font-size: 60px;

    animation-duration: 8s;
    animation-delay: 2s;
}


.heart:nth-child(6) {

    left: 65%;
    top: 58%;

    font-size: 42px;

    animation-duration: 10s;
    animation-delay: 4s;
}


.heart:nth-child(7) {

    left: 77%;
    top: 17%;

    font-size: 70px;

    animation-duration: 9s;
    animation-delay: 1s;
}


.heart:nth-child(8) {

    left: 89%;
    top: 72%;

    font-size: 45px;

    animation-duration: 11s;
    animation-delay: 3s;
}


.heart:nth-child(9) {

    left: 2%;
    top: 48%;

    font-size: 35px;

    animation-duration: 9s;
    animation-delay: 4s;
}


.heart:nth-child(10) {

    left: 85%;
    top: 43%;

    font-size: 62px;

    animation-duration: 8s;
    animation-delay: 2s;
}


.heart:nth-child(11) {

    left: 14%;
    top: 34%;

    font-size: 32px;

    animation-duration: 12s;
    animation-delay: 5s;
}


.heart:nth-child(12) {

    left: 60%;
    top: 35%;

    font-size: 38px;

    animation-duration: 10s;
    animation-delay: 1s;
}


/* =========================================================
   HEART ANIMATION
========================================================= */

@keyframes floatHeart {

    0% {

        opacity: 0.18;

        transform:
            translateY(20px)
            rotate(-8deg)
            scale(0.95);
    }


    50% {

        opacity: 0.75;

        transform:
            translateY(-22px)
            rotate(8deg)
            scale(1.05);
    }


    100% {

        opacity: 0.18;

        transform:
            translateY(20px)
            rotate(-8deg)
            scale(0.95);
    }
}


/* =========================================================
   WELCOME OCTOBER
========================================================= */

.welcome-text {

    position: absolute;

    z-index: 10;

    left: 50%;
    top: 18%;

    transform: translateX(-50%);

    width: 50%;

    text-align: center;

    color: #000;

    font-family: "Itim", sans-serif;

    font-size: clamp(
        42px,
        5vw,
        78px
    );

    line-height: 1.25;

    pointer-events: none;
}


.welcome-text div {

    white-space: nowrap;
}


/* =========================================================
   MUSIC PLAYER
   For you.png
========================================================= */

.music-player {

    position: absolute;

    z-index: 15;

    left: clamp(
        25px,
        6vw,
        100px
    );

    bottom: clamp(
        35px,
        7vh,
        80px
    );

    width: clamp(
        360px,
        34vw,
        520px
    );

    transition:
        transform 0.3s ease;
}


.music-player img {

    display: block;

    width: 100%;
    height: auto;

    user-select: none;

    -webkit-user-drag: none;
}


.music-player:hover {

    transform:
        translateY(-5px);
}


/* =========================================================
   POLAROID
   For you2.png
========================================================= */

.polaroid {

    position: absolute;

    z-index: 12;

    width: clamp(
        210px,
        19vw,
        330px
    );

    right: clamp(
        50px,
        8vw,
        150px
    );

    top: clamp(
        90px,
        20vh,
        190px
    );

    transform:
        rotate(10deg);

    transform-origin: center center;

    transition:
        transform 0.35s ease;
}


.polaroid img {

    display: block;

    width: 100%;
    height: auto;

    user-select: none;

    -webkit-user-drag: none;
}


.polaroid:hover {

    transform:
        rotate(7deg)
        scale(1.03);
}


/* =========================================================
   TABLET / IPAD
========================================================= */

@media
(min-width: 768px)
and (max-width: 1199px) {

    .welcome-text {

        font-size:
            clamp(
                48px,
                6vw,
                72px
            );

        top: 17%;
    }


    .music-player {

        width:
            clamp(
                320px,
                42vw,
                470px
            );

        left: 4vw;

        bottom: 7vh;
    }


    .polaroid {

        width:
            clamp(
                190px,
                24vw,
                290px
            );

        right: 7vw;

        top: 18vh;

        transform:
            rotate(10deg);
    }
}


/* =========================================================
   IPAD PORTRAIT
========================================================= */

@media
(min-width: 768px)
and (max-width: 1199px)
and (orientation: portrait) {

    .welcome-text {

        top: 18%;

        width: 70%;

        font-size:
            clamp(
                48px,
                8vw,
                70px
            );
    }


    .polaroid {

        width: 27vw;

        right: 6vw;

        top: 16vh;

        transform:
            rotate(10deg);
    }


    .music-player {

        width: 55vw;

        left: 5vw;

        bottom: 7vh;
    }
}


/* =========================================================
   MOBILE PORTRAIT
========================================================= */

@media
(max-width: 767px)
and (orientation: portrait) {


    .welcome-text {

        z-index: 10;

        top: 19%;

        width: 80%;

        font-size:
            clamp(
                40px,
                11vw,
                62px
            );

        line-height: 1.28;
    }


    /* -------------------------
       POLAROID
    ------------------------- */

    .polaroid {

        z-index: 12;

        width:
            clamp(
                185px,
                43vw,
                260px
            );

        right: 4vw;

        top: 8vh;

        transform:
            rotate(10deg);
    }


    /* -------------------------
       MUSIC
    ------------------------- */

    .music-player {

        z-index: 15;

        width:
            clamp(
                300px,
                78vw,
                480px
            );

        left: 50%;

        bottom: 8vh;

        transform:
            translateX(-50%);
    }


    .music-player:hover {

        transform:
            translateX(-50%);
    }


    /* -------------------------
       HEARTS
    ------------------------- */

    .heart:nth-child(1) {

        font-size: 40px;
    }


    .heart:nth-child(2) {

        font-size: 30px;
    }


    .heart:nth-child(3) {

        font-size: 55px;
    }


    .heart:nth-child(4) {

        font-size: 35px;
    }


    .heart:nth-child(5) {

        font-size: 45px;
    }


    .heart:nth-child(6) {

        font-size: 30px;
    }


    .heart:nth-child(7) {

        font-size: 50px;
    }


    .heart:nth-child(8) {

        font-size: 35px;
    }


    .heart:nth-child(9) {

        font-size: 28px;
    }


    .heart:nth-child(10) {

        font-size: 45px;
    }


    .heart:nth-child(11) {

        font-size: 25px;
    }


    .heart:nth-child(12) {

        font-size: 30px;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media
(max-width: 420px)
and (orientation: portrait) {


    .welcome-text {

        top: 19%;

        width: 85%;

        font-size:
            clamp(
                36px,
                11vw,
                52px
            );
    }


    .polaroid {

        width: 42vw;

        right: 3vw;

        top: 7vh;

        transform:
            rotate(10deg);
    }


    .music-player {

        width: 82vw;

        bottom: 7vh;
    }
}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media
(max-width: 360px)
and (orientation: portrait) {


    .welcome-text {

        top: 18%;

        font-size: 35px;
    }


    .polaroid {

        width: 41vw;

        right: 3vw;

        top: 6vh;
    }


    .music-player {

        width: 86vw;

        bottom: 6vh;
    }
}


/* =========================================================
   PHONE LANDSCAPE
========================================================= */

@media
(max-width: 767px)
and (orientation: landscape) {


    .welcome-text {

        display: none;
    }


    .polaroid {

        width: 24vw;

        right: 9vw;

        top: 8vh;

        transform:
            rotate(10deg);
    }


    .music-player {

        width: 42vw;

        left: 4vw;

        bottom: 5vh;

        transform: none;
    }


    .music-player:hover {

        transform:
            translateY(-5px);
    }
}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media
(prefers-reduced-motion: reduce) {

    * {

        animation: none !important;

        transition: none !important;
    }
}

</style>

</head>


<body>


<div class="page">

    <div class="content">


        <!-- ================================================
             FLOATING HEARTS
        ================================================= -->

        <div class="hearts">

            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>
            <span class="heart">♡</span>

        </div>


        <!-- ================================================
             WELCOME
        ================================================= -->

        <div class="welcome-text">

            <div>Welcome</div>

            <div>october</div>

        </div>


        <!-- ================================================
             POLAROID
        ================================================= -->

        <div class="polaroid">

            <img
                src="For you2.png"
                alt="Polaroid photos"
            >

        </div>


        <!-- ================================================
             MUSIC PLAYER
        ================================================= -->

        <div class="music-player">

            <img
                src="For you.png"
                alt="Music player"
            >

        </div>


    </div>

</div>


<script>

/* =========================================================
   ป้องกันรูปถูกลาก
========================================================= */

document
.querySelectorAll("img")
.forEach(function(img) {

    img.addEventListener(
        "dragstart",
        function(event) {

            event.preventDefault();

        }
    );

});


/* =========================================================
   ปรับหน้าจอหลังหมุนมือถือ
========================================================= */

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            function() {

                window.scrollTo(0, 0);

            },
            100
        );

    }
);

</script>


</body>

</html>
